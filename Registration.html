<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Avikate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      width: 90%;
      max-width: 400px;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }
    h1 { color: #0a2e6b; text-align: center; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
    #message { text-align: center; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Join Avikate</h1>
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="new-password">
    <button id="registerBtn">Create Account</button>
    <p id="message"></p>
  </div>

  <!-- Use the UMD build of supabase-js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    // TODO: replace these with your project's values (use the anon/public key, NOT a service_role key)
    const SUPABASE_URL = "YOUR_SUPABASE_URL"; // e.g. https://xyzabc.supabase.co
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";

    // Create the client from the global 'supabase' provided by the UMD bundle
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const registerBtn = document.getElementById('registerBtn');
    const messageEl = document.getElementById('message');

    registerBtn.addEventListener('click', register);
    // allow Enter to submit
    [document.getElementById('email'), document.getElementById('password')].forEach(el =>
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') register(); })
    );

    async function register() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      messageEl.textContent = '';
      if (!email || !password) {
        messageEl.textContent = "Please enter your email and password.";
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating...';

      try {
        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password
        });

        if (error) {
          console.error('Supabase signUp error:', error);
          messageEl.textContent = error.message || 'Signup failed';
          return;
        }

        // success
        console.log('signUp data:', data);
        messageEl.textContent = "Account created! Check your email to verify your account.";
      } catch (err) {
        console.error('Unexpected error:', err);
        messageEl.textContent = err.message || 'An unexpected error occurred';
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
