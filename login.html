<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avikate Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #087cff 0%, #0aaeff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #131921;
            margin-bottom: 10px;
        }

        .tagline {
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #131921;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #087cff;
            box-shadow: 0 0 0 3px rgba(8, 124, 255, 0.1);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .remember-forgot a {
            color: #087cff;
            text-decoration: none;
        }

        .remember-forgot a:hover {
            text-decoration: underline;
        }

        .checkbox {
            display: flex;
            align-items: center;
        }

        .checkbox input {
            width: auto;
            margin-right: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FF9900;
            color: #131921;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }

        button:hover {
            background: #FFA500;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }

        .signup-link {
            text-align: center;
        }

        .signup-link a {
            color: #087cff;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .seller-option {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }

        .seller-option a {
            color: #087cff;
            text-decoration: none;
            font-weight: bold;
        }

        .seller-option a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #087cff;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🛍️ AVIKATE</div>
    <div class="tagline">BUY • SELL • GROW</div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="remember-forgot">
            <label class="checkbox">
                <input type="checkbox" id="remember">
                <span>Remember me</span>
            </label>
            <a href="#forgot">Forgot Password?</a>
        </div>

        <button type="submit">Sign In</button>
    </form>

    <div class="divider">OR</div>

    <div class="signup-link">
        Don't have an account? <a href="registration.html">Create one here</a>
    </div>

    <div class="seller-option">
        Want to sell on Avikate? <a href="seller-login.html">Seller Login</a>
    </div>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // Simulate validation
        if (password.length < 6) {
            errorMsg.textContent = '❌ Password must be at least 6 characters';
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            return;
        }

        // Simulate successful login
        errorMsg.style.display = 'none';
        successMsg.textContent = '✓ Login successful! Redirecting...';
        successMsg.style.display = 'block';

        // Store user data in localStorage
        localStorage.setItem('user', JSON.stringify({
            email: email,
            role: 'buyer',
            loginTime: new Date().toLocaleString()
        }));

        // Redirect after 1.5 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 1500);
    }
</script>

</body>
</html>
