<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avikate - Create Account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #087cff 0%, #0aaeff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #131921;
            margin-bottom: 10px;
        }

        .tagline {
            text-align: center;
            color: #666;
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        h2 {
            color: #131921;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: bold;
            color: #131921;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #087cff;
            box-shadow: 0 0 0 3px rgba(8, 124, 255, 0.1);
        }

        .account-type {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .account-option {
            flex: 1;
        }

        .account-option input[type="radio"] {
            display: none;
        }

        .account-option label {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            margin-bottom: 0;
        }

        .account-option input[type="radio"]:checked + label {
            border-color: #087cff;
            background: #f0f7ff;
            color: #087cff;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .terms input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms a {
            color: #087cff;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #FF9900;
            color: #131921;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 15px;
        }

        button:hover {
            background: #FFA500;
        }

        .login-link {
            text-align: center;
            font-size: 14px;
        }

        .login-link a {
            color: #087cff;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #666;
            text-decoration: none;
            font-size: 13px;
        }

        .back-home a:hover {
            color: #087cff;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .account-type {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">🛍️ AVIKATE</div>
    <div class="tagline">BUY • SELL • GROW</div>

    <h2>Create Your Account</h2>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <div class="account-type">
        <div class="account-option">
            <input type="radio" id="buyer" name="accountType" value="buyer" checked>
            <label for="buyer">👤 Buyer</label>
        </div>
        <div class="account-option">
            <input type="radio" id="seller" name="accountType" value="seller">
            <label for="seller">🏪 Seller</label>
        </div>
    </div>

    <form id="registrationForm" onsubmit="handleRegistration(event)">
        <div class="form-row">
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" placeholder="John" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="+1 (555) 123-4567">
        </div>

        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" placeholder="Minimum 8 characters" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password *</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
        </div>

        <div id="sellerFields" style="display: none;">
            <div class="form-group">
                <label for="storeName">Store Name</label>
                <input type="text" id="storeName" name="storeName" placeholder="My Amazing Store">
            </div>

            <div class="form-group">
                <label for="businessType">Business Type</label>
                <select id="businessType" name="businessType">
                    <option value="">Select Business Type</option>
                    <option value="individual">Individual Seller</option>
                    <option value="small">Small Business</option>
                    <option value="enterprise">Enterprise</option>
                </select>
            </div>
        </div>

        <div class="terms">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms" style="margin-bottom: 0; font-weight: normal;">
                I agree to Avikate's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
        Already have an account? <a href="login.html">Sign in here</a>
    </div>

    <div class="back-home">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

<script>
    // Show/hide seller fields based on account type
    document.querySelectorAll('input[name="accountType"]').forEach(radio => {
        radio.addEventListener('change', function() {
            const sellerFields = document.getElementById('sellerFields');
            if (this.value === 'seller') {
                sellerFields.style.display = 'block';
            } else {
                sellerFields.style.display = 'none';
            }
        });
    });

    function handleRegistration(event) {
        event.preventDefault();

        const firstName = document.getElementById('firstName').value;
        const lastName = document.getElementById('lastName').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const accountType = document.querySelector('input[name="accountType"]:checked').value;
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');

        // Validation
        if (password.length < 8) {
            errorMsg.textContent = '❌ Password must be at least 8 characters';
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            return;
        }

        if (password !== confirmPassword) {
            errorMsg.textContent = '❌ Passwords do not match';
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            return;
        }

        // Success
        errorMsg.style.display = 'none';
        successMsg.textContent = '✓ Account created successfully! Redirecting to login...';
        successMsg.style.display = 'block';

        // Store registration data
        localStorage.setItem('newUser', JSON.stringify({
            firstName: firstName,
            lastName: lastName,
            email: email,
            accountType: accountType,
            registrationTime: new Date().toLocaleString()
        }));

        // Redirect to login
        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    }
</script>

</body>
</html>
